# En cada cambio, GitHub compila el RTL y corre los 19 testbenches con
# Icarus Verilog. Si algo deja de pasar, lo vemos antes de ir al laboratorio.
name: Simulación del RTL

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Correr los testbenches
        run: bash fpga/sim/correr_pruebas.sh

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-simulacion
          path: fpga/sim/resultados/
